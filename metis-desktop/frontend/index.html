<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Metis</title>
    <style>
        :root { color-scheme: light dark; --boot-bg: #f6f7fa; --boot-fg: #555c6e; }
        @media (prefers-color-scheme: dark) {
            :root { --boot-bg: #151517; --boot-fg: #adb2b8; }
        }
        :root[data-theme="light"] { color-scheme: light; --boot-bg: #f6f7fa; --boot-fg: #555c6e; }
        :root[data-theme="dark"] { color-scheme: dark; --boot-bg: #151517; --boot-fg: #adb2b8; }
        html, body { margin: 0; height: 100%; background: var(--boot-bg); overflow: hidden; }
        #boot {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--boot-fg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            font-size: 14px;
        }
        #metis-frame { display: none; width: 100%; height: 100%; border: 0; background: var(--boot-bg); }
    </style>
</head>
<body>
<div id="boot"><span id="boot-status">正在启动 Metis…</span></div>
<iframe id="metis-frame" title="Metis Desktop"></iframe>
<script type="module" src="./src/main.js"></script>
</body>
</html>
