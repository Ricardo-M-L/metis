name: Verify Published Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published vX.Y.Z release tag to verify (registered CLI-only or full stable)
        required: true
        type: string

permissions:
  contents: read

jobs:
  inventory:
    name: Verify immutable asset inventory
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.inventory.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: source

      - name: Download and verify all release assets
        id: inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid stable release tag: $TAG" >&2
            exit 1
          fi

          # Unregistered stable releases still require exactly the 20 immutable assets.
          # Only repository-registered CLI-only releases use the 12-asset schema.
          python3 release-tools/scripts/release_contract.py plan --tag "$TAG" > plan.json
          channel=$(jq -r .channel plan.json)
          if [ "$channel" != stable ]; then
            python3 release-tools/scripts/release_contract.py plan --tag "$TAG" \
              --registry source/.github/cli-only-releases.json > source-plan.json
            cmp plan.json source-plan.json
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest.json
          mkdir source/dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir source/dist
          python3 release-tools/scripts/release_contract.py verify --tag "$TAG" \
            --metadata release.json --latest latest.json --dist source/dist
          if [ "$channel" != stable ]; then
            release-tools/scripts/verify-dist.sh --repo source --tag "$TAG"
          fi
          for sidecar in source/dist/*.sha256; do
            sidecar_name=${sidecar#source/dist/}
            # PowerShell-authored checksum files may use CRLF. Validate the
            # manifest content without treating the trailing CR as a filename.
            (cd source/dist && sed 's/\r$//' "$sidecar_name" | shasum -a 256 -c -)
          done
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  install-smoke-unix:
    name: Anonymous install smoke (Linux)
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install without a GitHub token
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          install_dir="$RUNNER_TEMP/metis-bin"
          env -u METIS_GITHUB_TOKEN -u GITHUB_TOKEN \
            METIS_VERSION="$TAG" METIS_INSTALL_DIR="$install_dir" \
            bash install/install.sh
          reported=$("$install_dir/metis" version | awk 'NR == 1 { print $1 }')
          test "$reported" = "$TAG"

  install-smoke-windows:
    name: Anonymous install smoke (Windows)
    needs: inventory
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install without a GitHub token
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          Remove-Item Env:METIS_GITHUB_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $installDir = Join-Path $env:RUNNER_TEMP "metis-bin"
          & ./install/install.ps1 -Version $env:TAG -InstallDir $installDir
          $output = @(& (Join-Path $installDir "metis.exe") version)
          if ($LASTEXITCODE -ne 0) { throw "installed metis.exe version failed" }
          $reported = ($output[0] -split '\s+')[0]
          if ($reported -ne $env:TAG) {
            throw "installed metis.exe reports $reported instead of $env:TAG"
          }

  macos-trust:
    name: Verify macOS signing, notarization, and Gatekeeper
    needs: inventory
    if: needs.inventory.outputs.channel == 'stable'
    runs-on: macos-latest
    steps:
      - name: Download official macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'metis-desktop-darwin-universal.*' --dir dist

      - name: Verify checksums and Apple trust chain
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 -c metis-desktop-darwin-universal.zip.sha256)
          (cd dist && shasum -a 256 -c metis-desktop-darwin-universal.dmg.sha256)
          hdiutil verify dist/metis-desktop-darwin-universal.dmg

          mkdir unpacked
          ditto -x -k dist/metis-desktop-darwin-universal.zip unpacked
          version=${TAG#v}
          # One updater bridge release keeps the legacy ZIP root required by
          # v0.4.42. Bundle metadata and the DMG name are already METIS.
          if [ -d unpacked/metis-desktop.app ]; then
            app=unpacked/metis-desktop.app
          else
            app=unpacked/Metis.app
          fi
          test -d "$app"
          if [ "$version" != "0.4.42" ]; then
            test "$(defaults read "$PWD/$app/Contents/Info" CFBundleName)" = "METIS"
            test "$(defaults read "$PWD/$app/Contents/Info" CFBundleDisplayName)" = "METIS"
          fi
          test "$(defaults read "$PWD/$app/Contents/Info" CFBundleExecutable)" = "metis-desktop"
          test "$(defaults read "$PWD/$app/Contents/Info" CFBundleShortVersionString)" = "$version"

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

          codesign --verify --verbose=2 dist/metis-desktop-darwin-universal.dmg
          xcrun stapler validate dist/metis-desktop-darwin-universal.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 \
            dist/metis-desktop-darwin-universal.dmg
