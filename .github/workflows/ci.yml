name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 -timeout 90s ./...

  desktop:
    name: Desktop build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: metis-desktop/go.mod
          cache: true
          cache-dependency-path: metis-desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: metis-desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: metis-desktop/frontend
        run: npm ci

      - name: Check and build frontend
        working-directory: metis-desktop/frontend
        run: |
          npm run check
          npm run build

      - name: Vet desktop module
        working-directory: metis-desktop
        run: go vet ./...

      - name: Test desktop module
        working-directory: metis-desktop
        run: go test -race -count=1 ./...

      - name: Build production desktop module
        working-directory: metis-desktop
        run: go build -tags production ./...
