name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dist:
    name: Cross-platform dist & manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify all release assets
        run: make verify-dist

  test:
    name: Build & test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 -timeout 90s ./...

      - name: Vet patched Bubble Tea module
        working-directory: vendor-patches/bubbletea-v2
        run: go vet ./...

      - name: Test patched Bubble Tea module
        working-directory: vendor-patches/bubbletea-v2
        run: go test -race -count=1 ./...

      - name: Vet patched Ultraviolet module
        working-directory: vendor-patches/ultraviolet
        run: go vet ./...

      - name: Test patched Ultraviolet module
        working-directory: vendor-patches/ultraviolet
        run: go test -race -count=1 ./...

  desktop:
    name: Desktop build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: metis-desktop/go.mod
          cache: true
          cache-dependency-path: metis-desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: metis-desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: metis-desktop/frontend
        run: npm ci

      - name: Check and build frontend
        working-directory: metis-desktop/frontend
        run: |
          npm run check
          npm run build

      - name: Vet desktop module
        working-directory: metis-desktop
        run: go vet ./...

      - name: Test desktop module
        working-directory: metis-desktop
        run: go test -race -count=1 ./...

      - name: Build production desktop module
        working-directory: metis-desktop
        run: go build -tags production ./...

  windows:
    name: Windows CLI build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: pwsh
        run: |
          $out = gofmt -l .
          if ($out) {
            throw "gofmt found unformatted files:`n$out"
          }

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Run CLI smoke checks
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP "metis.exe"
          go build -o $binary ./cmd/metis
          & $binary version
          if ($LASTEXITCODE -ne 0) { throw "metis version failed" }
          & $binary help
          if ($LASTEXITCODE -ne 0) { throw "metis help failed" }

      # The full suite contains Unix-specific behavior checks (POSIX file
      # modes, /bin/bash, and slash-root paths). Linux and macOS run it above;
      # Windows exercises the CLI plus the platform-specific install/update
      # lifecycle while go vet/build still cover every package.
      - name: Test Windows CLI and lifecycle
        run: go test -count=1 -timeout 90s ./cmd/metis ./install ./internal/update

      - name: Cross-build Windows arm64
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "arm64"
          go build -o (Join-Path $env:RUNNER_TEMP "metis-arm64.exe") ./cmd/metis
          if ($LASTEXITCODE -ne 0) { throw "Windows arm64 cross-build failed" }
