# PREPARED RECOVERY ONLY: install as existing .github/workflows/release.yml
# on a reviewed tooling branch. Never merge into main or move v0.4.106.
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact source tag (only v0.4.106 is accepted)
        required: true
        type: string
      tooling_sha:
        description: Reviewed full tooling commit SHA (must equal this dispatch commit)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-v0.4.106
  cancel-in-progress: false
jobs:
  desktop-build:
    name: Desktop ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin/universal
            asset: darwin-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3be8647f9d5e5c04e7005e474f1c956058b0d79f
          fetch-depth: 0

      - name: Check out reviewed recovery tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools

      - name: Verify terminal infrastructure failure and download exact original CU
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.tag }}
          TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          python3 -B release-tools/scripts/recover-release-106.py download \
            --tag "$TARGET_TAG" --tooling-sha "$TOOLING_SHA" --source . \
            --scope cu --dist computer-use-artifact --evidence recovery-mac-evidence

      - name: Stage Computer Use catalog and archives for Desktop
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          test -s computer-use-artifact/releases.json
          test -f internal/computeruse/releases.json
          cp computer-use-artifact/releases.json internal/computeruse/releases.json
          mkdir -p metis-desktop/computer-use-release
          cp computer-use-artifact/metis-cu-darwin-arm64.tar.gz \
            computer-use-artifact/metis-cu-darwin-amd64.tar.gz \
            computer-use-artifact/metis-cu-darwin-arm64.tar.gz.sha256 \
            computer-use-artifact/metis-cu-darwin-amd64.tar.gz.sha256 \
            metis-desktop/computer-use-release/

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            metis-desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: metis-desktop/frontend/package-lock.json

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare same-source embedded CLI for Desktop
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Historical tags retain their original packaging contract.
          if [ -f scripts/prepare-desktop-cli.py ]; then
            python -B -m unittest discover -s scripts -p 'test_prepare_desktop_cli.py'
            if [ "${PLATFORM%%/*}" != darwin ]; then
              python scripts/prepare-desktop-cli.py --platform "$PLATFORM"
            fi
          fi

      - name: Check and build frontend
        working-directory: metis-desktop/frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: Vet, race-test, and production-build Desktop (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: metis-desktop
        run: |
          tags=
          production_tags=production
          if [ "$RUNNER_OS" = "Linux" ]; then
            tags='-tags webkit2_41'
            production_tags='production webkit2_41'
          fi
          go vet $tags ./...
          go test -race -count=1 $tags ./...
          go build -tags "$production_tags" ./...

      - name: Vet, race-test, and production-build Desktop (Windows)
        if: runner.os == 'Windows'
        working-directory: metis-desktop
        shell: pwsh
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -tags production ./...

      - name: Build and package Desktop (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: metis-desktop
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -eu
          tags=
          if [ "$RUNNER_OS" = "Linux" ]; then
            tags='-tags webkit2_41'
          fi
          wails build -clean -s -trimpath -platform "$PLATFORM" $tags
          mkdir -p release-dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            # New sources build METIS.app. Keep historical-tag backfills
            # verifiable under the bundle name declared by those old sources.
            if [ -d build/bin/METIS.app ]; then
              app=build/bin/METIS.app
            elif [ -d build/bin/metis-desktop.app ]; then
              app=build/bin/metis-desktop.app
            else
              echo "Wails did not create a supported macOS application bundle" >&2
              exit 1
            fi
            # New-source bundles contain the exact compiled-catalog helper
            # archives before outer-app signing; historical tags lack this
            # script and retain their original release contract.
            if [ -f ../scripts/bundle-computer-use.py ]; then
              python3 -B -m unittest discover -s ../scripts -p 'test_bundle_computer_use.py'
              python3 ../scripts/bundle-computer-use.py --app "$app" --artifact-dir "$PWD/computer-use-release"
            fi
            if [ -f ../scripts/prepare-desktop-cli.py ]; then
              python3 ../scripts/prepare-desktop-cli.py --platform "$PLATFORM" --app "$app"
            fi
            # CLI is already signed and hashed; signing only the outer app
            # preserves its manifest while deep verification checks both.
            codesign --force --sign - "$app"
            codesign --verify --deep --strict "$app"
            if [ -f ../scripts/prepare-desktop-cli.py ]; then
              python3 ../scripts/prepare-desktop-cli.py --platform "$PLATFORM" --app "$app" --verify-only --execute-version
              env -u METIS_BIN -u METIS_CLI_PATH -u METIS_DESKTOP_CLI PATH=/usr/bin:/bin \
                "$app/Contents/MacOS/metis-desktop" --runtime-check
            fi
            # v0.4.42's updater only recognizes metis-desktop.app inside the
            # updater ZIP. Keep one bridge generation while the source-built
            # and user-facing DMG bundle is METIS.app. The new updater accepts
            # both roots and installs into the existing application path.
            if [ "$app" = build/bin/METIS.app ]; then
              bridge_app=build/bin/metis-desktop.app
              test ! -e "$bridge_app"
              mv "$app" "$bridge_app"
              app=$bridge_app
            fi
            asset="metis-desktop-${ASSET}.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "release-dist/$asset"
            unzip -tq "release-dist/$asset"
          else
            if [ -f ../scripts/prepare-desktop-cli.py ]; then
              env -u METIS_BIN -u METIS_CLI_PATH -u METIS_DESKTOP_CLI PATH=/usr/bin:/bin \
                ./build/bin/metis-desktop --runtime-check
            fi
            asset="metis-desktop-${ASSET}.tar.gz"
            tar -C build/bin -czf "release-dist/$asset" metis-desktop
            test "$(tar -tzf "release-dist/$asset")" = "metis-desktop"
          fi
          (cd release-dist && shasum -a 256 "$asset" > "$asset.sha256")

      - name: Build and package Desktop (Windows)
        if: runner.os == 'Windows'
        working-directory: metis-desktop
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET: ${{ matrix.asset }}
        run: |
          wails build -clean -s -trimpath -platform $env:PLATFORM
          if (Test-Path ../scripts/prepare-desktop-cli.py) {
            Remove-Item Env:METIS_BIN -ErrorAction SilentlyContinue
            Remove-Item Env:METIS_CLI_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:METIS_DESKTOP_CLI -ErrorAction SilentlyContinue
            $originalPath = $env:PATH
            try {
              $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
              & ./build/bin/metis-desktop.exe --runtime-check
              if ($LASTEXITCODE -ne 0) { throw "Desktop cannot run its own bundled CLI" }
            } finally { $env:PATH = $originalPath }
          }
          New-Item -ItemType Directory -Force release-dist | Out-Null
          $asset = "metis-desktop-$env:ASSET.zip"
          Compress-Archive -LiteralPath build/bin/metis-desktop.exe -DestinationPath "release-dist/$asset"
          $smoke = Join-Path $env:RUNNER_TEMP "metis-desktop-smoke"
          Expand-Archive -LiteralPath "release-dist/$asset" -DestinationPath $smoke
          if (-not (Test-Path (Join-Path $smoke "metis-desktop.exe"))) {
            throw "Desktop archive does not contain metis-desktop.exe"
          }
          $digest = (Get-FileHash -Algorithm SHA256 "release-dist/$asset").Hash.ToLowerInvariant()
          $sidecar = Join-Path (Get-Location) "release-dist/$asset.sha256"
          [System.IO.File]::WriteAllText(
            $sidecar,
            "$digest  $asset`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - uses: actions/upload-artifact@v4
        with:
          name: metis-desktop-${{ matrix.asset }}-v0.4.106
          path: metis-desktop/release-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  stage-draft:
    name: Stage immutable release draft
    needs: desktop-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
      - uses: actions/checkout@v4
        with:
          ref: 3be8647f9d5e5c04e7005e474f1c956058b0d79f
          path: source
          fetch-depth: 0
      - name: Verify six original gates and download exact original twenty assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.tag }}
          TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          python3 -B release-tools/scripts/recover-release-106.py download \
            --tag "$TARGET_TAG" --tooling-sha "$TOOLING_SHA" --source source \
            --scope all --dist dist --evidence recovery-download

      - name: Require a draft and stage verified non-macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.4.106
          CHANNEL: stable
          TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -mindepth 1 -maxdepth 1 -type f -print | sort)
          expected=20
          if [ "${#assets[@]}" -ne "$expected" ]; then
            echo "expected exactly $expected verified assets, found ${#assets[@]}" >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest-before.json
          if python3 release-tools/scripts/release_contract.py lookup --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" > release.json; then
            python3 release-tools/scripts/release_contract.py verify --tag "$TAG" \
              --metadata release.json --latest latest-before.json --phase draft --allow-partial-draft
          else
            lookup_status=$?
            # Only error-free GraphQL with explicit release:null allows create.
            # Transport/auth/JSON failures never masquerade as absence.
            if [ "$lookup_status" -ne 4 ]; then exit "$lookup_status"; fi
            channel_flags=()
            if [ "$CHANNEL" != "stable" ]; then channel_flags=(--latest=false); fi
            if [ "$CHANNEL" = "cli-only-prerelease" ]; then channel_flags+=(--prerelease); fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "${TAG#v}" --generate-notes "${channel_flags[@]}"
          fi

          # Re-read immediately before any replacement. Public releases are
          # immutable, including CLI-only releases; only drafts may retry.
          python3 release-tools/scripts/release_contract.py lookup --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" > release.json
          release_id=$(jq -r .id release.json)
          python3 release-tools/scripts/release_contract.py verify --tag "$TAG" \
            --metadata release.json --latest latest-before.json --phase draft --allow-partial-draft
          # gh release upload/download share its draft-aware FetchRelease. Bind
          # that resolution to the ID already validated before allowing writes.
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)" = "$release_id"
          python3 -B release-tools/scripts/recover-release-106.py check \
            --tag "$TAG" --tooling-sha "$TOOLING_SHA" --source source \
            --evidence recovery-before-upload
          existing_count=$(jq '.assets | length' release.json)
          if [ "$existing_count" = 0 ]; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${assets[@]}"
          elif [ "$existing_count" = 20 ]; then
            echo "Existing 20-asset draft: preserve all asset identities and verify exact bytes below."
          else
            echo "Refusing to modify a non-empty partial/full draft ($existing_count assets)." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest-after.json
          verification_flags=(--allow-partial-draft)
          if [ "$CHANNEL" != "stable" ]; then verification_flags=(--dist dist); fi
          python3 release-tools/scripts/release_contract.py verify --tag "$TAG" \
            --metadata release.json --latest latest-after.json --phase draft "${verification_flags[@]}"

      - name: Record finalization gate
        env:
          TAG: v0.4.106
          CHANNEL: stable
        run: |
          {
            echo "### Draft staged for $TAG"
            echo
            if [ "$CHANNEL" != "stable" ]; then
              echo "Registered $CHANNEL: exactly 12 CLI assets, registry-matched prerelease flag, make_latest=false."
              echo "Run Publish CLI Release after review; no Desktop release, no shared latest/updater promotion."
            else
              echo "The draft intentionally omits the four official macOS files."
              echo "Add the Developer ID signed, notarized, stapled ZIP/DMG and their SHA-256 sidecars, verify all 24 assets, then publish the draft exactly once."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify staged bytes against original immutable artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.tag }}
          TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          python3 -B release-tools/scripts/recover-release-106.py verify-stage \
            --tag "$TARGET_TAG" --tooling-sha "$TOOLING_SHA" --source source \
            --dist dist --download-evidence recovery-download --evidence recovery-final

      - name: Upload exact-source recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: metis-recovery-evidence-v0.4.106
          path: recovery-final/*.json
          if-no-files-found: error
          retention-days: 7
