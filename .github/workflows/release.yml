name: Release

on:
  push:
    # GitHub tag filters are globs, so the build job performs the authoritative
    # stable-semver check before any source is built or published.
    tags:
      - 'v*'
  # Rebuild an existing stable, version-consistent tag with the current release
  # tooling. Existing public releases are immutable; only drafts may be updated.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag to (re)build binaries for (e.g. v0.4.18)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Validate and build all platforms
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - name: Resolve and validate target tag
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag=$INPUT_TAG
          else
            tag=${PUSH_REF#refs/tags/}
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag (expected stable vX.Y.Z): $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # For workflow_dispatch, release-tools is the current default-branch
      # workflow commit while source is the historical tag being backfilled.
      # On a tag push both checkouts resolve to the tagged commit.
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
          path: source
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum

      - name: Run root release gates
        working-directory: source
        run: |
          ../release-tools/scripts/verify-release-policy.sh
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          go build ./...
          go test -count=1 -timeout 120s ./...

      - name: Vet and race-test patched Bubble Tea
        working-directory: source/vendor-patches/bubbletea-v2
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Vet and race-test patched Ultraviolet
        working-directory: source/vendor-patches/ultraviolet
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Cross-compile and verify release set
        working-directory: source
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: make -f ../release-tools/Makefile verify-dist TAG="$TAG"

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: metis-release-${{ steps.ref.outputs.tag }}
          path: source/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  smoke-unix-artifact:
    name: Smoke verified Linux artifact
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: metis-release-${{ needs.build.outputs.tag }}
          path: dist

      - name: Checksum, extract, and run
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd dist
          shasum -a 256 -c metis-linux-amd64.tar.gz.sha256
          mkdir smoke
          tar -xzf metis-linux-amd64.tar.gz -C smoke
          reported=$(smoke/metis-linux-amd64 version | awk 'NR == 1 { print $1 }')
          test "$reported" = "$TAG"

  smoke-windows-artifact:
    name: Smoke verified Windows artifact
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: metis-release-${{ needs.build.outputs.tag }}
          path: dist

      - name: Checksum, extract, and run
        shell: pwsh
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          $archive = Join-Path $PWD "dist/metis-windows-amd64.zip"
          $expected = ((Get-Content "$archive.sha256") -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Windows archive checksum mismatch" }
          $smokeDir = Join-Path $env:RUNNER_TEMP "metis-smoke"
          Expand-Archive -LiteralPath $archive -DestinationPath $smokeDir
          $output = @(& (Join-Path $smokeDir "metis.exe") version)
          if ($LASTEXITCODE -ne 0) { throw "metis.exe version failed" }
          $reported = ($output[0] -split '\s+')[0]
          if ($reported -ne $env:TAG) {
            throw "metis.exe reports $reported instead of $env:TAG"
          }

  desktop-build:
    name: Desktop ${{ matrix.asset }}
    if: github.event_name == 'push'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            asset: linux-amd64
          - os: windows-latest
            platform: windows/amd64
            asset: windows-amd64
          - os: macos-latest
            platform: darwin/universal
            asset: darwin-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            metis-desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: metis-desktop/frontend/package-lock.json

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Check and build frontend
        working-directory: metis-desktop/frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: Vet, race-test, and production-build Desktop (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: metis-desktop
        run: |
          tags=
          production_tags=production
          if [ "$RUNNER_OS" = "Linux" ]; then
            tags='-tags webkit2_41'
            production_tags='production webkit2_41'
          fi
          go vet $tags ./...
          go test -race -count=1 $tags ./...
          go build -tags "$production_tags" ./...

      - name: Vet, race-test, and production-build Desktop (Windows)
        if: runner.os == 'Windows'
        working-directory: metis-desktop
        shell: pwsh
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -tags production ./...

      - name: Build and package Desktop (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: metis-desktop
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -eu
          tags=
          if [ "$RUNNER_OS" = "Linux" ]; then
            tags='-tags webkit2_41'
          fi
          wails build -clean -s -trimpath -platform "$PLATFORM" $tags
          mkdir -p release-dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            codesign --force --deep --sign - build/bin/metis-desktop.app
            codesign --verify --deep --strict build/bin/metis-desktop.app
            asset="metis-desktop-${ASSET}.zip"
            ditto -c -k --sequesterRsrc --keepParent build/bin/metis-desktop.app "release-dist/$asset"
            unzip -tq "release-dist/$asset"
          else
            asset="metis-desktop-${ASSET}.tar.gz"
            tar -C build/bin -czf "release-dist/$asset" metis-desktop
            test "$(tar -tzf "release-dist/$asset")" = "metis-desktop"
          fi
          (cd release-dist && shasum -a 256 "$asset" > "$asset.sha256")

      - name: Build and package Desktop (Windows)
        if: runner.os == 'Windows'
        working-directory: metis-desktop
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET: ${{ matrix.asset }}
        run: |
          wails build -clean -s -trimpath -platform $env:PLATFORM
          New-Item -ItemType Directory -Force release-dist | Out-Null
          $asset = "metis-desktop-$env:ASSET.zip"
          Compress-Archive -LiteralPath build/bin/metis-desktop.exe -DestinationPath "release-dist/$asset"
          $smoke = Join-Path $env:RUNNER_TEMP "metis-desktop-smoke"
          Expand-Archive -LiteralPath "release-dist/$asset" -DestinationPath $smoke
          if (-not (Test-Path (Join-Path $smoke "metis-desktop.exe"))) {
            throw "Desktop archive does not contain metis-desktop.exe"
          }
          $digest = (Get-FileHash -Algorithm SHA256 "release-dist/$asset").Hash.ToLowerInvariant()
          "$digest  $asset" | Set-Content "release-dist/$asset.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: metis-desktop-${{ matrix.asset }}-${{ needs.build.outputs.tag }}
          path: metis-desktop/release-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  stage-draft:
    name: Stage immutable release draft
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.smoke-unix-artifact.result == 'success' &&
      needs.smoke-windows-artifact.result == 'success' &&
      (github.event_name != 'push' || needs.desktop-build.result == 'success')
    needs: [build, smoke-unix-artifact, smoke-windows-artifact, desktop-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: metis-release-${{ needs.build.outputs.tag }}
          path: dist

      # The macOS runner artifact is an ad-hoc-signed CI smoke artifact only.
      # Official macOS ZIP/DMG assets must be Developer ID signed, notarized,
      # and stapled locally before the draft is made public, so never stage the
      # runner-produced macOS archive in the GitHub Release.
      - name: Download Linux Desktop artifact
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          name: metis-desktop-linux-amd64-${{ needs.build.outputs.tag }}
          path: dist

      - name: Download Windows Desktop artifact
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          name: metis-desktop-windows-amd64-${{ needs.build.outputs.tag }}
          path: dist

      - name: Require a draft and stage verified non-macOS assets
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          mapfile -t assets < <(find dist -mindepth 1 -maxdepth 1 -type f -print | sort)
          expected=12
          if [ "$EVENT_NAME" = "push" ]; then expected=16; fi
          if [ "${#assets[@]}" -ne "$expected" ]; then
            echo "expected exactly $expected verified assets, found ${#assets[@]}" >&2
            exit 1
          fi

          if is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "release $TAG is already public; refusing to replace its assets" >&2
              exit 1
            fi
          else
            # If lookup failed for any reason other than absence, creation also
            # fails before upload. This keeps an existing public release intact.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "${TAG#v}" --generate-notes
          fi

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"

      - name: Record finalization gate
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          {
            echo "### Draft staged for $TAG"
            echo
            echo "The draft intentionally omits the four official macOS files."
            echo "Add the Developer ID signed, notarized, stapled ZIP/DMG and their SHA-256 sidecars, verify all 20 assets, then publish the draft exactly once."
          } >> "$GITHUB_STEP_SUMMARY"
