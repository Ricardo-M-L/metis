name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger lets us backfill binaries to an existing tag's release
  # without recreating the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build binaries for (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile and upload
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          # Need full history so `git describe --tags` in the Makefile picks
          # up the tag we just checked out.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile (darwin/linux/windows × amd64/arm64)
        run: make dist

      - name: List artifacts
        run: ls -lah dist/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          # If we're on a fresh tag push, the release may not exist yet.
          # gh release upload --clobber works for both fresh and backfill.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "${TAG#v}" \
              --generate-notes
          fi
          # Build the list from assets that actually exist. This preserves the
          # workflow_dispatch backfill path for old tags whose Makefile did not
          # create Windows archives yet.
          mapfile -t assets < <(find dist -maxdepth 1 -type f \
            \( -name 'metis-*.tar.gz' -o -name 'metis-*.tar.gz.sha256' \
               -o -name 'metis-*.zip' -o -name 'metis-*.zip.sha256' \) \
            -print | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release assets found" >&2
            exit 1
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"

  smoke-unix:
    name: Anonymous install smoke (Linux)
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Install without a GitHub token
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          install_dir="$RUNNER_TEMP/metis-bin"
          env -u METIS_GITHUB_TOKEN -u GITHUB_TOKEN \
            METIS_VERSION="$TAG" METIS_INSTALL_DIR="$install_dir" \
            bash install/install.sh
          "$install_dir/metis" version

  smoke-windows:
    name: Anonymous install smoke (Windows)
    if: github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Install without a GitHub token
        shell: pwsh
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          Remove-Item Env:METIS_GITHUB_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $installDir = Join-Path $env:RUNNER_TEMP "metis-bin"
          & ./install/install.ps1 -Version $env:TAG -InstallDir $installDir
          & (Join-Path $installDir "metis.exe") version
